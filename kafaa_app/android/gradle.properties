org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin needs Flutter 3.47+; this project is on 3.44.8, whose
# migrator also forces newDsl=false. Staying on the KGP path instead, with
# AGP pinned to 8.x in settings.gradle.kts so plugins apply KGP themselves.
android.builtInKotlin=false
# Kotlin 2.3.20 under the Build Tools API re-registers its incremental-cache
# storages while closing them, failing every compileDebugKotlin task with
# "Storage for [...] is already registered". Plugin modules are compiled
# non-incrementally regardless, so the caches only cost us the crash.
kotlin.incremental=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
